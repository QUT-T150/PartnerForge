name: CI

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]

jobs:
  backend-ci:
    name: Backend (.NET C#) CI & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore packages
        run: dotnet restore
        working-directory: api/Qut.PartnerForge.Api

      - name: Build C# API solution
        run: dotnet build --no-restore -warnAsError
        working-directory: api/Qut.PartnerForge.Api

      - name: Check C# formatting
        run: dotnet format --verify-no-changes --no-restore
        working-directory: api/Qut.PartnerForge.Api/Qut.PartnerForge.Api

      - name: Run C# backend unit & integration tests
        run: dotnet test --no-build --verbosity normal
        working-directory: api/Qut.PartnerForge.Api

  frontend-ci:
    name: Frontend (Next.js & Vitest) CI & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install
        working-directory: frontend

      - name: Run TypeScript typecheck
        run: pnpm exec tsc --noEmit
        working-directory: frontend

      - name: Run frontend unit & performance tests
        run: pnpm test
        working-directory: frontend

